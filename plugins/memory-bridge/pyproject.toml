[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-bridge"
version = "0.1.0"
description = "Universal memory plugin bridge: exposes mem0-style MCP tools to the agent and routes to swappable backends via the AML Add/Search contract."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "openai>=1.40",
]

[project.scripts]
memory-bridge = "memory_bridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_bridge"]
